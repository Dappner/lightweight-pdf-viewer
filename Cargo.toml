[package]
name = "lightweight-pdf-viewer"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
# Zero-copy pixel buffers: tiles are drawn straight into the `Color32`s egui uploads.
bytemuck = { version = "1.25.2", features = ["derive", "extern_crate_alloc"] }
eframe = { version = "0.33.3", default-features = false, features = ["wgpu", "default_fonts"] }
# Only the Metal backend (eframe's defaults would also pull in GL/Vulkan backends).
egui-wgpu = { version = "0.33.3", default-features = false, features = ["macos-window-resize-jitter-fix"] }
qoi = "0.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# The PDF engine (CoreGraphics, PDFKit) and the native menu bar, Finder and file dialog glue.
# Elsewhere the crate still builds, so the portable core can be tested and benchmarked.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.6.2", default-features = false, features = ["std"] }
objc2 = { version = "0.6.4", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSCell", "NSMenu", "NSMenuItem", "NSApplication", "NSResponder", "NSEvent"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFURL", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGPDFDocument", "CGPDFPage", "CGContext", "CGBitmapContext", "CGColorSpace", "CGImage", "CGAffineTransform"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSNotification", "NSOperation", "NSString", "NSArray", "NSURL", "NSObject"] }
objc2-pdf-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-graphics", "PDFDocument", "PDFPage", "PDFOutline", "PDFDestination", "PDFAnnotation", "PDFAnnotationUtilities", "PDFAction", "PDFActionURL", "PDFActionGoTo", "PDFSelection"] }
rfd = "0.17.2"

# winit needs a windowing backend to build elsewhere; only the headless tests and benches run there.
[target.'cfg(not(target_os = "macos"))'.dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["x11"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
libc = "0.2.189"
png = "0.18.1"
pollster = "0.4.0"

[[bench]]
name = "session"
harness = false

[[bench]]
name = "search_spike"
harness = false

[[bench]]
name = "search"
harness = false

[[bench]]
name = "render_spike"
harness = false
