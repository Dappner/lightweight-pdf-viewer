[package]
name = "lightweight-pdf-viewer"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A small, fast PDF viewer for macOS, with tabs"
repository = "https://github.com/Dappner/lightweight-pdf-viewer"
readme = "README.md"
keywords = ["pdf", "viewer", "macos"]
categories = ["gui"]
rust-version = "1.90"
# An app, not a library.
publish = false

[dependencies]
# Zero-copy pixel buffers: tiles are drawn straight into the `Color32`s egui uploads.
bytemuck = { version = "1.25.2", features = ["derive", "extern_crate_alloc"] }
eframe = { version = "0.33.3", default-features = false, features = ["wgpu", "default_fonts"] }
# Keep presentation asynchronous when a tiling manager resizes several windows together.
# eframe 0.33 tracks only the last resized viewport for the transaction-based jitter fix;
# interleaved resizes can leave another surface presenting inside CoreAnimation transactions.
egui-wgpu = { version = "0.33.3", default-features = false }
qoi = "0.4.1"
# Save-time Preview compatibility: parse PDF dictionaries and Apple's keyed plist without
# decoding annotation classes or depending on private framework APIs.
base64 = "0.23.1"
lopdf = { version = "0.45.0", default-features = false }
plist = { version = "1.10.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# The PDF engine (CoreGraphics, PDFKit) and the native menu bar, Finder and file dialog glue.
# Elsewhere the crate still builds, so the portable core can be tested and benchmarked.
[target.'cfg(target_os = "macos")'.dependencies]
# Select Metal explicitly; the optional resize workaround used to enable it indirectly.
wgpu = { version = "27.0.1", default-features = false, features = ["metal"] }
# The process footprint shown in Settings.
libc = "0.2.189"
block2 = { version = "0.6.2", default-features = false, features = ["std"] }
objc2 = { version = "0.6.4", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSCell", "NSMenu", "NSMenuItem", "NSApplication", "NSResponder", "NSEvent", "NSFont", "NSColor", "NSPrintInfo", "NSPrintOperation", "NSView", "NSWindow", "NSScreen", "objc2-core-foundation"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFURL", "CFCGTypes", "CFData", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGPDFDocument", "CGPDFPage", "CGContext", "CGBitmapContext", "CGColorSpace", "CGImage", "CGAffineTransform", "CGPDFDictionary", "CGPDFArray", "CGPDFObject", "CGPDFString", "CGPDFContext", "CGDataConsumer"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSData", "NSNotification", "NSOperation", "NSString", "NSArray", "NSURL", "NSObject", "NSValue", "NSGeometry", "objc2-core-foundation"] }
objc2-image-io = { version = "0.3.2", default-features = false, features = ["std", "CGImageSource", "CGImageProperties", "objc2-core-graphics"] }
objc2-pdf-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-graphics", "objc2-app-kit", "PDFDocument", "PDFPage", "PDFOutline", "PDFDestination", "PDFAnnotation", "PDFAnnotationUtilities", "PDFAction", "PDFActionURL", "PDFActionGoTo", "PDFSelection"] }
rfd = "0.17.2"

# winit needs a windowing backend to build elsewhere; only the headless tests and benches run there.
[target.'cfg(not(target_os = "macos"))'.dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["x11"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Vulkan, so the GPU tests can find a device off macOS too (Mesa's drivers on Linux).
# libc for the session bench's CPU time; on macOS the app's own dependency serves.
[target.'cfg(not(target_os = "macos"))'.dev-dependencies]
wgpu = { version = "27.0.1", default-features = false, features = ["vulkan"] }
libc = "0.2.189"

[dev-dependencies]
png = "0.18.1"
pollster = "0.4.0"

[[bench]]
name = "session"
harness = false

[[bench]]
name = "search_spike"
harness = false

[[bench]]
name = "search"
harness = false

[[bench]]
name = "render_spike"
harness = false

[[bench]]
name = "text_spike"
harness = false

[[bench]]
name = "native_windows"
harness = false
